<!DOCTYPE html>

  <meta name="description" content="Martha Rdz Hairartist">
  <title>Martha Rdz Hairartist</title>
  <!-- Standalone en iOS (agregada a inicio): sin esto, "Agregar a inicio"
       abre la app dentro de un navegador con su propia barra, y ah\u00ed el
       notch/Dynamic Island ya los resuelve Safari solo. Con esto se abre
       a pantalla completa y el dise\u00f1o es responsable de su propio espacio
       \u2014para eso est\u00e1n viewport-fit=cover arriba y las safe areas en
       styles.css. Se deja la barra de estado en su estilo normal (no
       "black-translucent"): con fondo claro, los \u00edconos de hora/bater\u00eda
       en blanco forzado casi no se ver\u00edan. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Martha Rdz">
  <!-- Splash de arranque en iOS: a diferencia de Android, Safari no arma
       una pantalla de carga sola con el manifest — sin esto se ve un
       blanco en seco unos instantes al abrir la app instalada. iOS elige
       la imagen exacta por el tamaño físico de pantalla de cada modelo
       (no hay un solo archivo "de sobra"), así que hace falta una etiqueta
       por tamaño; las que no coinciden con el equipo simplemente no se
       cargan. Los PNG viven en /img/splash/ (mismo logo y fondo cream que
       el login) y se generaron con public/img/splash/generate.py. -->
  <link rel="apple-touch-startup-image" href="/img/splash/640x1136.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

<body>
  <div id="app">
    <!-- Pantallas inyectadas din\u00e1micamente por el router -->
  </div>

  <!-- Toast de notificaciones -->
  <div id="toast" class="toast hidden"></div>

  <!-- Loader global -->
  <div id="loader" class="loader hidden">
    <div class="loader-spinner"></div>
  </div>

  <!-- Sin query string a propósito: cada vista importa `navigateTo` de
       vuelta con `from '../app.js'` (sin versión) — si aquí trae una,
       el resolver de módulos ES lo trata como un archivo DISTINTO y toda
       la app se carga por duplicado (dos listeners de hashchange, cada
       llamada a la API disparada dos veces). Cache-Control ya fuerza
       revalidar /js/(.*) en cada carga (ver vercel.json) y el Service
       Worker sirve JS "network-first" — no hace falta este cache-busting
       manual, y aquí activamente rompe el módulo. -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
